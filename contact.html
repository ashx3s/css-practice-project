<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Page</title>
  <link rel="stylesheet" href="./assets/reset.css">
  <link rel="stylesheet" href="./assets/styles.css">
</head>

<body>
  <header class="site-header">
    <div class="site-logo">
      <a href="index.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <path fill="#f8f8ff"
            d="M256 0C114.6 0 0 114.6 0 256s114.6 256 256 256c68.8 0 131.3-27.2 177.3-71.4c7.3-7 9.4-17.9 5.3-27.1s-13.7-14.9-23.8-14.1c-4.9.4-9.8.6-14.8.6c-101.6 0-184-82.4-184-184c0-72.1 41.5-134.6 102.1-164.8c9.1-4.5 14.3-14.3 13.1-24.4s-8.6-18.3-18.5-20.5C294.4 2.2 275.4 0 256 0" />
        </svg><span>Elivra</span></a>
    </div>
    <nav class="site-nav">
      <ul class="site-nav-links">
        <li><a href="portfolio.html">Portolio</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <header>
      <h1>Contact Us</h1>
      <p>Interested in our web development freelance services? Fill out the form below and we'll get back to you as soon
        as possible.</p>
    </header>

    <section>
      <form action="#" method="post">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div>
          <label for="services">Services</label>
          <select id="services" name="services" required>
            <option value="">Please select a service</option>
            <option value="web-design">Web Design</option>
            <option value="web-development">Web Development</option>
            <option value="responsive-design">Responsive Design</option>
            <option value="ecommerce">E-commerce Solutions</option>
            <option value="maintenance">Website Maintenance</option>
            <option value="consultation">Consultation</option>
          </select>
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>

        <div>
          <button type="submit">Send Message</button>
        </div>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 Elvira Studebaker. All rights reserved.</p>
  </footer>
</body>

</html>
